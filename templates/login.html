<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — SNCF Maintenance TGV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body>
<div class="login-wrap">

  <!-- Panneau gauche -->
  <div class="login-left">
    <div class="login-brand">🚅</div>
    <div class="login-tagline">Maintenance TGV</div>
    <div class="login-sub">Plateforme de suivi, analyse et prédiction des écarts de planification</div>
    <div class="login-stats">
      <div class="ls-item"><div class="ls-val">98K</div><div class="ls-lbl">Opérations</div></div>
      <div class="ls-item"><div class="ls-val">S1–S12</div><div class="ls-lbl">Couverture</div></div>
      <div class="ls-item"><div class="ls-val">3</div><div class="ls-lbl">Axes IA</div></div>
    </div>
  </div>

  <!-- Panneau droit -->
  <div class="login-right">
    <div class="login-card">
      <h1>Connexion</h1>
      <p>Accédez à votre espace de gestion de la maintenance</p>

      {% if error %}
      <div class="alert-err"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <div class="form-group">
          <label>Identifiant</label>
          <div class="fi">
            <i class="bi bi-person"></i>
            <input type="text" name="username" placeholder="user" required autofocus/>
          </div>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <div class="fi">
            <i class="bi bi-lock"></i>
            <input type="password" name="password" placeholder="••••" required/>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i> Se connecter
        </button>
      </form>

      <div class="login-hint">
        Login : <code>user</code> &nbsp;·&nbsp; Mot de passe : <code>user</code>
      </div>
    </div>
  </div>

</div>
</body>
</html>
